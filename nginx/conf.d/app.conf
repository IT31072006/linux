# ==============================================================================
# Nginx Gateway Server Configuration
# Upstream backend_service được khai báo động trong 00-upstream.conf
# ==============================================================================
server {
    listen 80;
    server_name _;

    # Client body size limit chống DoS tải file lớn
    client_max_body_size 10M;

    # Security Headers chuẩn OWASP
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Thư mục chứa Static Frontend Web Dashboard
    root /usr/share/nginx/html;
    index index.html;

    # 1. Healthcheck probe (bỏ qua rate limiting để monitoring/scripts không bị chặn)
    location /health {
        proxy_pass http://backend_service/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # 2. Endpoint Prometheus metrics (chỉ cho phép truy cập từ mạng nội bộ Docker subnet hoặc máy chủ)
    location /metrics {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://backend_service/metrics;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # 3. Swagger API Docs & OpenAPI Schema
    location ~ ^/(docs|openapi.json|redoc) {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. API Endpoints (Áp dụng Rate Limiting 15r/s, burst 10)
    location /api/ {
        limit_req zone=api_limit_ip burst=10 nodelay;

        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        
        # Thiết lập header chuyển tiếp thông tin client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts tránh treo connection khi backend quá tải
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 5. Giao diện Web Frontend (Static SPA)
    location / {
        limit_req zone=api_limit_ip burst=15 nodelay;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Trang lỗi tùy biến JSON
    error_page 429 /429.json;
    location = /429.json {
        default_type application/json;
        return 429 '{"error": "Too Many Requests", "message": "Rate limit exceeded. Please slow down."}';
    }

    error_page 502 503 504 /50x.json;
    location = /50x.json {
        default_type application/json;
        return 503 '{"error": "Service Unavailable", "message": "Backend is temporarily offline or undergoing rolling update."}';
    }
}
